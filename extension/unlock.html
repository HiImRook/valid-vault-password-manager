<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Valid Vault - Unlock</title>
  <style>
    @font-face {
      font-family: 'Orbitron';
      src: url('Orbitron.ttf') format('truetype');
      font-weight: 700 900;
      font-display: swap;
    }
    :root {
      --bg: #0a0e0a;
      --bg-raise: #0d130d;
      --green: #33ff66;
      --green-dim: #1f9e40;
      --green-faint: #163020;
      --text: #b8f0c4;
      --text-dim: #6fae7f;
      --danger: #ff5555;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Courier New", "Consolas", "DejaVu Sans Mono", monospace;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container { width: 100%; max-width: 340px; padding: 20px; }
    .wordmark {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      color: var(--green);
      font-size: 17px;
      letter-spacing: 2px;
      text-align: center;
      margin-bottom: 10px;
      text-shadow: 0 0 8px rgba(51,255,102,0.4);
    }
    .site { text-align: center; color: var(--text-dim); font-size: 12px; margin-bottom: 14px; word-break: break-all; }
    .site b { color: var(--text); font-weight: 700; }
    .section { background: var(--bg-raise); border: 1px solid var(--green-faint); border-radius: 8px; padding: 14px; }
    button {
      background: var(--green); color: #05140a; border: none;
      padding: 11px 16px; border-radius: 6px; cursor: pointer;
      font-family: inherit; font-size: 13px; font-weight: 700; width: 100%; margin: 4px 0;
      letter-spacing: 0.5px; transition: background 0.15s, box-shadow 0.15s;
    }
    button:hover { background: #5aff80; box-shadow: 0 0 14px rgba(51,255,102,0.25); }
    button.small { padding: 10px 14px; font-size: 12px; width: auto; margin: 0; }
    button.link { background: transparent; color: var(--text-dim); font-weight: 400; margin-top: 10px; }
    button.link:hover { color: var(--green); box-shadow: none; background: transparent; }
    .row { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
    .pw-wrap { position: relative; display: flex; align-items: center; flex: 1; }
    input {
      background: var(--bg); border: 1px solid var(--green-faint); color: var(--text);
      padding: 10px 40px 10px 10px; border-radius: 6px; width: 100%;
      font-family: inherit; font-size: 13px;
    }
    input:focus { outline: none; border-color: var(--green-dim); box-shadow: 0 0 0 2px rgba(51,255,102,0.1); }
    input::placeholder { color: var(--text-dim); }
    .pw-eye { position: absolute; right: 8px; background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 4px; margin: 0; width: auto; display: flex; align-items: center; }
    .pw-eye:hover { color: var(--green); background: none; box-shadow: none; }
    .pw-eye svg { width: 20px; height: 20px; fill: currentColor; }
    .msg { min-height: 16px; margin-top: 10px; font-size: 12px; text-align: center; color: var(--text-dim); }
    .msg.error { color: var(--danger); }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="wordmark">VALID VAULT</div>
    <div class="site" id="site"></div>
    <div class="section">
      <button id="btn-fingerprint" class="hidden">Unlock with Fingerprint</button>
      <div class="row">
        <div class="pw-wrap">
          <input type="password" id="input-password" placeholder="Master password" autocomplete="off" spellcheck="false">
          <button type="button" class="pw-eye" id="btn-eye" aria-label="Show/hide"><svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.7 7.6 1 12c1.7 4.4 6 7.5 11 7.5s9.3-3.1 11-7.5c-1.7-4.4-6-7.5-11-7.5zm0 12.5a5 5 0 110-10 5 5 0 010 10zm0-8a3 3 0 100 6 3 3 0 000-6z"/></svg></button>
        </div>
        <button class="small" id="btn-password">Go</button>
      </div>
    </div>
    <div id="msg" class="msg"></div>
    <button class="link" id="btn-cancel">Cancel</button>
  </div>
  <script type="module" src="unlock.js"></script>
</body>
</html>
