<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Valid Vault - Unlock</title>
  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; }
    .body { flex: 1; display: flex; flex-direction: column; justify-content: center; width: 100%; max-width: 360px; margin: 0 auto; padding: 14px 16px 10px; }
    .site { text-align: center; color: var(--text-dim); font-size: 13px; margin-bottom: 14px; word-break: break-all; line-height: 1.4; }
    .site b { color: var(--text); font-weight: 700; }
    .fp { width: 100%; min-height: 46px; display: flex; align-items: center; justify-content: center; gap: 9px; }
    .fp svg { width: 22px; height: 22px; fill: currentColor; }
    #btn-fingerprint.hidden + .or { display: none; }
    .pw-wrap { position: relative; flex: 1; min-width: 0; display: flex; align-items: center; }
    .pw-wrap input { width: 100%; padding-right: 42px; }
    button.pw-eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; min-height: 0; padding: 0; display: flex; align-items: center; justify-content: center; border: none; background: none; box-shadow: none; color: var(--text-dim); text-shadow: none; }
    button.pw-eye:active { transform: translateY(-50%); background: none; box-shadow: none; }
    button.pw-eye svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; filter: none; }
    .go { width: 46px; min-height: 46px; padding: 0; display: flex; align-items: center; justify-content: center; flex: none; }
    .go svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .lead { margin-bottom: 12px; color: var(--text); }
    button.link { display: block; margin: 4px auto 0; min-height: 0; padding: 6px 12px; border: none; background: none; box-shadow: none; text-shadow: none; color: var(--text-dim); font-size: 13px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--green-faint); }
    button.link:hover { color: var(--text); }
    button.link:active { transform: none; background: none; box-shadow: none; }
    #msg { min-height: 34px; }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="vv-mark-fill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color: var(--mark-1)"/><stop offset="1" style="stop-color: var(--mark-2)"/></linearGradient><clipPath id="vv-mark-clip"><path d="M4,4 L104,4 L171,262 L238,4 L338,4 L171,399 Z"/></clipPath><mask id="vv-mark-mask"><g fill="#fff"><rect x="0" y="8.00" width="342" height="14.44"/><rect x="0" y="36.89" width="342" height="14.44"/><rect x="0" y="65.78" width="342" height="14.44"/><rect x="0" y="94.67" width="342" height="14.44"/><rect x="0" y="123.56" width="342" height="14.44"/><rect x="0" y="152.44" width="342" height="14.44"/><rect x="0" y="181.33" width="342" height="14.44"/><rect x="0" y="210.22" width="342" height="14.44"/><rect x="0" y="239.11" width="342" height="14.44"/><rect x="0" y="268.00" width="342" height="14.44"/><rect x="0" y="296.89" width="342" height="14.44"/><rect x="0" y="325.78" width="342" height="14.44"/><rect x="0" y="354.67" width="342" height="14.44"/><rect x="0" y="383.56" width="342" height="14.44"/></g></mask></defs><symbol id="vv-mark" viewBox="0 0 342 403"><g clip-path="url(#vv-mark-clip)"><rect width="342" height="403" fill="url(#vv-mark-fill)" mask="url(#vv-mark-mask)"/></g></symbol></svg>
  <div class="topbar">
    <div class="brand"><svg viewBox="0 0 342 403" aria-hidden="true"><use href="#vv-mark"/></svg>VALID VAULT</div>
    <div class="topbar-actions"><button class="icon-btn" data-theme-toggle title="Switch between day and night"><span class="when-night"><svg class="vv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1z"/></svg></span><span class="when-day"><svg class="vv-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg></span></button></div>
  </div>
  <div class="body">
    <div class="site" id="site"></div>
    <div class="panel hidden" id="reconnect-box">
      <p class="lead">Unlocked. This browser needs your OK to keep your vault file in sync.</p>
      <button class="block" id="btn-reconnect">Reconnect vault file</button>
      <button class="link" id="btn-reconnect-skip">Not now</button>
    </div>
    <div class="panel" id="unlock-box">

      <div class="or">OR</div>
      <div class="row">
        <div class="pw-wrap">
          <input type="password" id="input-password" placeholder="Master password" autocomplete="off" spellcheck="false">
          <button type="button" class="pw-eye" id="btn-eye" aria-label="Show or hide password"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12c2-4.4 5.6-7 10-7s8 2.6 10 7c-2 4.4-5.6 7-10 7s-8-2.6-10-7z"/><circle cx="12" cy="12" r="3.2"/></svg></button>
        </div>
        <button class="go" id="btn-password" aria-label="Unlock with password"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
      </div>
    </div>
    <div id="msg" class="msg"></div>
    <button class="link" id="btn-cancel">Cancel</button>
  </div>
  <script type="module" src="unlock.js"></script>
</body>
</html>
