<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Valid Vault - Bookmarks</title>
  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; }
    .topbar { flex-wrap: wrap; row-gap: 12px; }
    .brand { font-size: 14px; letter-spacing: 0.24em; }
    .search { width: 100%; }
    .search input { width: 100%; }
    .count { color: var(--text-dim); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 8px; text-align: right; }
    .list { flex: 1; overflow-y: auto; padding: 12px 12px 18px; }
    .item {
      display: flex; align-items: center; gap: 8px; padding: 9px 8px 9px 10px; margin: 0 0 10px; cursor: pointer;
      border: var(--line) solid transparent; border-radius: 10px;
      background: linear-gradient(180deg, var(--raise-top), var(--raise-bottom)) padding-box, linear-gradient(135deg, var(--rim-a), var(--rim-b)) border-box;
      box-shadow: inset 0 1px 0 var(--hi), 0 3px 0 var(--drop), 0 4px 8px var(--shadow);
    }
    .item:active { transform: translateY(2px); box-shadow: inset 0 3px 6px var(--inner), 0 1px 0 var(--drop); }
    .item.confirming, .item.editing { cursor: default; }
    .item.confirming { background: linear-gradient(180deg, var(--raise-top), var(--raise-bottom)) padding-box, linear-gradient(135deg, var(--danger-rim-a), var(--danger-rim-b)) border-box; }
    .item.dragging { opacity: 0.4; }
    .item.drop-before { box-shadow: 0 -3px 0 var(--rim-a), 0 3px 0 var(--drop); }
    .item.drop-after { box-shadow: 0 6px 0 var(--rim-a); }
    .grip { color: var(--text-dim); font-size: 14px; letter-spacing: -3px; cursor: grab; padding: 4px 4px 4px 0; user-select: none; flex-shrink: 0; }
    .grip:hover { color: var(--text); }
    .grip:active { cursor: grabbing; }
    .item-text { flex: 1; min-width: 0; }
    .item-title { color: var(--text); font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: var(--emboss); }
    .item-host { color: var(--text-dim); font-size: 11px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item.confirming .item-title { white-space: normal; }
    button.item-btn { width: 30px; height: 30px; min-height: 0; padding: 0; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; border: none; background: none; box-shadow: none; color: var(--text-dim); border-radius: 8px; }
    button.item-btn:hover { color: var(--text); background: var(--green-faint); }
    button.item-btn.del:hover { color: var(--danger); }
    button.item-btn:active { transform: none; background: var(--green-faint); box-shadow: none; }
    .item-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; filter: none; }
    .rename-input { flex: 1; font-size: 13px; padding: 7px 9px; }
    .empty { color: var(--text-dim); font-size: 13px; text-align: center; padding: 28px 12px; line-height: 1.6; }
    .gate { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; gap: 16px; }
    .gate .mark svg { width: 46px; height: 54px; }
    .gate p { color: var(--text-dim); font-size: 13px; line-height: 1.6; max-width: 260px; }
    .gate button { width: 100%; max-width: 240px; }
    .btn-icon { width: 17px; height: 17px; margin-right: 8px; vertical-align: -3px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="vv-mark-fill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color: var(--mark-1)"/><stop offset="1" style="stop-color: var(--mark-2)"/></linearGradient><clipPath id="vv-mark-clip"><path d="M4,4 L104,4 L171,262 L238,4 L338,4 L171,399 Z"/></clipPath><mask id="vv-mark-mask"><g fill="#fff"><rect x="0" y="8.00" width="342" height="14.44"/><rect x="0" y="36.89" width="342" height="14.44"/><rect x="0" y="65.78" width="342" height="14.44"/><rect x="0" y="94.67" width="342" height="14.44"/><rect x="0" y="123.56" width="342" height="14.44"/><rect x="0" y="152.44" width="342" height="14.44"/><rect x="0" y="181.33" width="342" height="14.44"/><rect x="0" y="210.22" width="342" height="14.44"/><rect x="0" y="239.11" width="342" height="14.44"/><rect x="0" y="268.00" width="342" height="14.44"/><rect x="0" y="296.89" width="342" height="14.44"/><rect x="0" y="325.78" width="342" height="14.44"/><rect x="0" y="354.67" width="342" height="14.44"/><rect x="0" y="383.56" width="342" height="14.44"/></g></mask></defs><symbol id="vv-mark" viewBox="0 0 342 403"><g clip-path="url(#vv-mark-clip)"><rect width="342" height="403" fill="url(#vv-mark-fill)" mask="url(#vv-mark-mask)"/></g></symbol></svg>
  <div class="topbar">
    <div class="brand"><svg viewBox="0 0 342 403" aria-hidden="true"><use href="#vv-mark"/></svg>BOOKMARKS</div>
    <div class="topbar-actions"><button class="icon-btn" data-theme-toggle title="Switch between day and night"><span class="when-night"><svg class="vv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1z"/></svg></span><span class="when-day"><svg class="vv-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg></span></button></div>
    <div class="search">
      <input type="text" id="filter" placeholder="Search bookmarks" autocomplete="off" class="hidden">
      <div class="count hidden" id="count"></div>
    </div>
  </div>
  <div class="gate hidden" id="gate">
    <div class="mark"><svg viewBox="0 0 342 403" aria-hidden="true"><use href="#vv-mark"/></svg></div>
    <p>Your vault is locked. Unlock to see your bookmarks.</p>
    <button id="btn-unlock"><svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2.2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><path d="M12 14.6v2.2"/></svg>Unlock</button>
  </div>
  <div class="list hidden" id="list"></div>
  <script src="bookmarks-panel.js" type="module"></script>
</body>
</html>
