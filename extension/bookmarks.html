<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Valid Vault - Bookmarks</title>
  <style>
    @font-face {
      font-family: 'Orbitron';
      src: url('Orbitron.ttf') format('truetype');
      font-weight: 700 900;
      font-display: swap;
    }
    :root {
      --bg: #0a0e0a;
      --bg-raise: #0d130d;
      --panel: #101710;
      --green: #33ff66;
      --green-dim: #1f9e40;
      --green-faint: #163020;
      --text: #b8f0c4;
      --text-dim: #6fae7f;
      --danger: #ff5555;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Courier New", "Consolas", "DejaVu Sans Mono", monospace;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    .top { padding: 14px 12px 10px; border-bottom: 1px solid var(--green-faint); }
    .wordmark {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      color: var(--green);
      font-size: 15px;
      letter-spacing: 2px;
      text-align: center;
      margin-bottom: 10px;
      text-shadow: 0 0 8px rgba(51,255,102,0.4);
    }
    input {
      background: var(--bg); border: 1px solid var(--green-faint); color: var(--text);
      padding: 9px 10px; border-radius: 6px; width: 100%;
      font-family: inherit; font-size: 13px;
    }
    input:focus { outline: none; border-color: var(--green-dim); box-shadow: 0 0 0 2px rgba(51,255,102,0.1); }
    input::placeholder { color: var(--text-dim); }
    .list { flex: 1; overflow-y: auto; padding: 8px 10px 16px; }
    .item { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--green-faint); border-radius: 6px; padding: 8px 8px 8px 8px; margin: 6px 0; cursor: pointer; }
    .item:hover { border-color: var(--green-dim); }
    .item.dragging { opacity: 0.4; }
    .item.drop-before { box-shadow: 0 -2px 0 var(--green); }
    .item.drop-after { box-shadow: 0 2px 0 var(--green); }
    .grip { color: var(--text-dim); font-size: 14px; letter-spacing: -3px; cursor: grab; padding: 4px 6px 4px 0; user-select: none; flex-shrink: 0; }
    .grip:hover { color: var(--green); }
    .grip:active { cursor: grabbing; }
    .item.current { border-color: var(--green); }
    .item-text { flex: 1; min-width: 0; }
    .item-title { color: var(--green); font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-host { color: var(--text-dim); font-size: 11px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-btn { background: transparent; border: 1px solid transparent; color: var(--text-dim); border-radius: 4px; width: 28px; height: 28px; cursor: pointer; font-family: inherit; font-size: 13px; flex-shrink: 0; }
    .item-btn:hover { border-color: var(--green-dim); color: var(--green); }
    .item-btn.del:hover { border-color: var(--danger); color: var(--danger); }
    .rename-input { font-size: 13px; padding: 6px 8px; }
    .empty { color: var(--text-dim); font-size: 12px; text-align: center; padding: 24px 10px; line-height: 1.6; }
    .gate { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; gap: 12px; }
    .gate p { color: var(--text-dim); font-size: 12px; line-height: 1.6; }
    button.main {
      background: var(--green); color: #05140a; border: none;
      padding: 11px 16px; border-radius: 6px; cursor: pointer;
      font-family: inherit; font-size: 13px; font-weight: 700; width: 100%; max-width: 260px;
      letter-spacing: 0.5px;
    }
    button.main:hover { background: #5aff80; box-shadow: 0 0 14px rgba(51,255,102,0.25); }
    .count { color: var(--text-dim); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; margin-top: 8px; text-align: right; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="top">
    <div class="wordmark">BOOKMARKS</div>
    <input type="text" id="filter" placeholder="Search bookmarks" autocomplete="off" class="hidden">
    <div class="count hidden" id="count"></div>
  </div>
  <div class="gate hidden" id="gate">
    <p>Your vault is locked. Unlock to see your bookmarks.</p>
    <button class="main" id="btn-unlock">Unlock</button>
  </div>
  <div class="list hidden" id="list"></div>
  <script src="bookmarks-panel.js" type="module"></script>
</body>
</html>
