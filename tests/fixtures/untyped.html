<!doctype html><html><head><meta charset="utf-8"><title>Untyped Login</title>
<script type="module" src="/background.js"></script>
<script src="/content.js"></script>
</head><body>
<form id="f" onsubmit="event.preventDefault()">
<label for="u">Username</label><input id="u" name="login">
<label for="p">Password</label><input id="p" name="pass" type="password">

<button id="go" type="submit">Sign in</button>
</form>
</body></html>
